name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci (NestJS ${{ matrix.nest }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nest: ["11", "12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install NestJS ${{ matrix.nest }}
        run: >-
          yarn add --dev
          "@nestjs/common@^${{ matrix.nest }}"
          "@nestjs/core@^${{ matrix.nest }}"
          "@nestjs/platform-express@^${{ matrix.nest }}"
          "@nestjs/testing@^${{ matrix.nest }}"
        env:
          # The matrix overrides the locked NestJS version, so the lockfile is expected to change
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"

      - name: Lint
        run: yarn lint

      - name: Type check
        run: yarn check:types

      - name: Build
        run: yarn build

      - name: Check runtime entrypoints
        run: yarn check:runtime

      - name: Test
        run: yarn test:coverage

      - name: Upload coverage
        if: matrix.nest == '12'
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false

      - name: Check exports
        run: yarn check:exports

      - name: Check package
        run: yarn check:package

      - name: Check unused
        run: yarn check:unused

  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Publish preview
        run: npx pkg-pr-new publish

  e2e:
    name: e2e (NestJS ${{ matrix.nest }})
    runs-on: ubuntu-latest
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        nest: ["11", "12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install NestJS ${{ matrix.nest }}
        run: >-
          yarn add --dev
          "@nestjs/common@^${{ matrix.nest }}"
          "@nestjs/core@^${{ matrix.nest }}"
          "@nestjs/platform-express@^${{ matrix.nest }}"
          "@nestjs/testing@^${{ matrix.nest }}"
        env:
          # The matrix overrides the locked NestJS version, so the lockfile is expected to change
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"

      - name: E2E tests
        run: yarn test:e2e
